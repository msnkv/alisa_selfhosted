services:
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: alisa-searxng
    restart: unless-stopped
    ports:
      # Только localhost: из сети инстанс недоступен.
      - "127.0.0.1:8080:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "2"
