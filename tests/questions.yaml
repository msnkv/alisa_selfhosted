# Набор вопросов для проверки ассистента после изменений.
#
# Запуск:
#   .\test.ps1                 весь набор
#   .\test.ps1 --only data     только вопросы про мои файлы
#   .\test.ps1 --repeat 3      каждый вопрос по три раза (ловить нестабильность)
#
# Типы вопросов:
#   data   ответ должен прийти из файлов data/
#   known  ответ из знаний модели, без похода в интернет
#   fresh  нужен веб-поиск, по памяти отвечать нельзя
#
# Проверки у каждого вопроса:
#   tools       ожидание по инструментам: no (не должен искать),
#               yes (обязан искать), any (неважно)
#   expect_any  хотя бы одна из подстрок должна встретиться в ответе
#   forbid      ни одной из этих подстрок быть не должно
#   then        уточняющие вопросы, которые задаются в том же разговоре,
#               без сброса памяти - так проверяется, что ассистент держит тему
#
# Плюс к этому у всех вопросов проверяется общее: ответ не пустой,
# в нём нет цифр (их читает синтезатор речи) и он не длиннее бюджета.
#
# ВАЖНО: вопросы типа data опираются на содержимое data/. Если ты
# переписал свои файлы, поправь здесь expect_any под них - иначе прогон
# будет краснеть на ровном месте.

questions:
  # --- мои данные: гараж ----------------------------------------------
  - ask: "где лежат болгарки?"
    type: data
    tools: "no"
    expect_any: ["стеллаж"]
    # Код полки должен быть расшифрован словами, а не произнесён буквами.
    forbid: ["Л-Н", "Л-К", "П-Н", "П-К"]
    then:
      # Проверка памяти: вопрос без подлежащего должен понятся как
      # "а где перфоратор лежит", а не начать новую тему.
      - ask: "а перфоратор?"
        expect_any: ["стеллаж", "кейс", "уровень"]

  - ask: "где у меня аптечка?"
    type: data
    tools: "no"
    expect_any: ["стеллаж", "торц"]

  - ask: "где лежит бензопила?"
    type: data
    tools: "no"
    expect_any: ["стеллаж"]
    forbid: ["Л-Н", "П-Н", "П-К"]

  # --- мои данные: рецепты --------------------------------------------
  - ask: "как я квашу капусту?"
    type: data
    tools: "no"
    expect_any: ["соль", "соли", "морков", "гнёт", "гнет"]
    then:
      # То, что сломалось в живом разговоре: ассистент предложил
      # рассказать по шагам, а на "да" ушёл в рецепт хлеба.
      - ask: "да, расскажи, какой первый шаг"
        expect_any: ["капуст", "шинк", "морков", "соль", "соли"]
        forbid: ["опара", "закваск", "мук"]
      - ask: "а сколько соли?"
        expect_any: ["грамм", "капуст"]

  - ask: "чем я мариную шашлык?"
    type: data
    tools: "no"
    expect_any: ["лук", "соль", "соли", "специ", "перец", "масл"]

  # --- чего в файлах нет: найти, но не выдавать за моё -----------------
  - ask: "как я делаю борщ?"
    type: data
    # Борща в записях нет, значит рецепт надо найти в интернете.
    tools: "yes"
    # И обязательно пометить, что это не моя запись.
    expect_any: ["интернет", "не из тво", "не тво", "общий", "общие", "записях нет"]

  # --- общие знания ---------------------------------------------------
  - ask: "какой вегетационный период у репы?"
    type: known
    tools: "no"
    expect_any: ["дней", "дня"]

  - ask: "чем перфоратор отличается от шуруповёрта?"
    type: known
    tools: "no"
    expect_any: ["удар", "бетон", "сверл", "винт", "саморез"]

  - ask: "почему нельзя тушить горящее масло водой?"
    type: known
    tools: "no"
    expect_any: ["вскип", "брызг", "пар", "разлет", "разбрыз"]

  # --- свежая информация ----------------------------------------------
  - ask: "какой сейчас курс доллара?"
    type: fresh
    tools: "yes"
    expect_any: ["рубл"]

  - ask: "какая погода в Москве сегодня?"
    type: fresh
    tools: "yes"
    expect_any:
      ["градус", "тепл", "холод", "дожд", "облач", "ясн", "снег", "ветер"]

  - ask: "сколько стоит сейчас биткоин?"
    type: fresh
    tools: "yes"
    expect_any: ["доллар", "тысяч", "рубл"]

  - ask: "какие главные новости сегодня?"
    type: fresh
    tools: "yes"
    # Содержание новостей предсказать нельзя, поэтому проверяем только
    # то, что ассистент сходил в поиск и что-то сказал.
    expect_any: [""]
