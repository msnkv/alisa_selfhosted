# Настройки ассистента. Секретов здесь нет - ключи лежат в .env

assistant:
  # Как ассистент называет себя и чьи данные лежат в data/.
  # Поменяй на своё, это просто подставляется в промпт.
  name: "Алиса"
  owner: "Дима"

llm:
  # Актуальное имя быстрой модели DeepSeek (сверено с документацией 22.10.2026).
  model: "deepseek-flash"
  base_url: "https://api.deepseek.com"
  # У DeepSeek размышления включены по умолчанию и добавляют секунды к ответу.
  # Голосовому помощнику они не нужны: вопросы простые, а задержка слышна.
  thinking: false
  # Низкая температура - меньше фантазии в ответах про мои данные.
  temperature: 0.3
  max_tokens: 400
  timeout_s: 30

answer:
  # Ответ произносится вслух, поэтому держим его коротким.
  # Лимита по предложениям не хватает: модель умеет уложить целый рецепт
  # в три предложения по сорок слов каждое. Поэтому ещё и бюджет по словам.
  max_sentences: 3
  max_words: 45

data:
  # Папка с моими файлами. Содержимое целиком уходит в системный промпт
  # и перечитывается, если файл изменился.
  dir: "data"

logging:
  dir: "logs"
  level: "INFO"

search:
  # Пускать ли ассистента в интернет. Выключи, если хочешь проверить,
  # как он ведёт себя без доступа к сети.
  enabled: true
  # Бэкенд поиска. Сейчас доступен только ddgs - он опрашивает несколько
  # поисковиков сразу, без ключей и аккаунтов. SearXNG на VDS добавим на шаге 3.
  backend: "ddgs"
  # Движок внутри ddgs: auto перебирает доступные и берёт первый удачный.
  # Отдельные движки (duckduckgo, brave, google, yandex) часто отвечают
  # "ничего не найдено" из-за своих лимитов, поэтому auto надёжнее.
  engine: "auto"
  region: "ru-ru"
  max_results: 5
  # Поисковики отвечают через раз: один и тот же запрос то приносит
  # результаты, то падает с «ничего не найдено». Поэтому повторяем,
  # а на последней попытке запрос упрощается (без «какая», «сколько»).
  retries: 3
  # Сколько символов страницы отдавать модели. Больше - дороже и медленнее.
  page_chars: 6000
  fetch_timeout_s: 8

agent:
  # Сколько раз модель может сходить в инструменты за один вопрос.
  # Обычного "поиск, потом страница" хватает, запас - на переформулировку.
  max_steps: 4
  # Общий бюджет на весь цикл. Когда он кончается, инструменты отбираются
  # и модель обязана ответить словами: лучше честное "не нашёл", чем тишина.
  total_timeout_s: 35
