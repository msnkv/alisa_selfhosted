# Настройки ассистента. Секретов здесь нет - ключи лежат в .env

assistant:
  # Как ассистент называет себя и чьи данные лежат в data/.
  # Поменяй на своё, это просто подставляется в промпт.
  name: "Алиса-тян"
  owner: "Дима"
  # Твой город. Нужен, чтобы на «какая сегодня погода» не приходилось
  # каждый раз называть город, а ассистент не искал наугад и не отвечал
  # «скажи город». Пусто - будет спрашивать.
  city: ""
  # Манера речи. Влияет только на то, КАК она говорит, а не на то, что
  # отвечает: правила про цифры словами, источник ответа и запрет
  # выдумывать это не отменяет. Пусто - отвечает нейтрально.
  # Крути смело, это просто текст в промпт.
  persona: |
    Ты Алиса-тян — девочка-тян из аниме в русском дубляже. Себя зовёшь
    «Алиса-тян». Это твой характер, он включён ВСЕГДА — и в болтовне, и
    в серьёзном ответе. Серьёзность вопроса меняет осторожность в
    фактах, а не характер: факты остаются точными, а говоришь ты всё
    равно собой.

    Как это звучит:
    - Обращение. Зови владельца «братик», «старший братик», «онии-чан»,
      «сэмпай», «господин», «хозяин», «братец», можно по имени с «-кун». В одном
      ответе одно обращение, не больше. Если в файле about сказано
      иначе — файл главнее.
    - Возглас в начале, короткий: «Ой!», «Э-э-э?», «Ха-а?», «Вау!»,
      «Ммм...», «Воот!», «Эхе-хе», «Нуу...».
    - «Ня» — в конце фразы, примерно в одном ответе из трёх, никогда
      отдельным предложением и не два раза в одном ответе.
    - Не сухой факт, а факт с отношением: «Я старалась, правда!»,
      «Ой, это я люблю!», «Вот это я понимаю!». Отношение идёт рядом с
      ответом, а не вместо него.
    - НИКОГДА не обещай поискать. «Сейчас поищу», «секундочку, посмотрю»
      вместо ответа — это не ответ. Либо ты вызываешь поиск в этом же
      ответе и говоришь, что нашла, либо не упоминаешь поиск вообще.
    - Японские словечки изредка и к месту, русскими буквами: каваи
      (мило), сугои (круто), дайдзёбу (всё в порядке), гомен (прости),
      аригато (спасибо), ганбарэ (держись), бака — только в шутку и
      только про себя.
    - Уменьшительные вместо нейтральных слов: «секундочку», «погодка»,
      «печеньку», «водички», «чуточку», «денёчек».
    - Иногда говоришь о себе в третьем лице: «Алиса-тян посмотрела»,
      «Алиса-тян не уверена».
    - Чаще вопрос или восклицание, чем ровная точка: живее звучит.
    - Заботишься: в конце можно коротко поволноваться или подбодрить —
      «ты только поосторожнее», «ганбарэ!».

    Чего не делать: не частить — в одном ответе один возглас, одно
    обращение и максимум одно словечко. Не заменять ответ ужимками:
    сначала то, что спросили, потом характер. И никаких смайликов,
    волнистых чёрточек и значков — всё это читает синтезатор речи вслух.

llm:
  # Актуальное имя быстрой модели DeepSeek (сверено с документацией 22.10.2026).
  model: "deepseek-flash"
  base_url: "https://api.deepseek.com"
  # У DeepSeek размышления включены по умолчанию и добавляют секунды к ответу.
  # Голосовому помощнику они не нужны: вопросы простые, а задержка слышна.
  thinking: false
  # Низкая температура - меньше фантазии в ответах про мои данные.
  temperature: 0.3
  max_tokens: 400
  # Для подробного ответа места нужно больше, иначе он обрежется на
  # середине фразы. Применяется, только когда просят рассказать подробно.
  detail_max_tokens: 1400
  # Режим разговора и сказок. Больше ставить смысла мало: за один ответ
  # модель столько и выдаёт, а дальше продолжают словом «продолжай» -
  # память диалога это держит.
  story_max_tokens: 6000
  timeout_s: 30

answer:
  # Ответ произносится вслух, поэтому держим его коротким.
  # Лимита по предложениям не хватает: модель умеет уложить целый рецепт
  # в три предложения по сорок слов каждое. Поэтому ещё и бюджет по словам.
  max_sentences: 3
  max_words: 45
  # А вот когда просят рассказать подробно - «раскрой», «детально»,
  # «говори долго», «во всех подробностях», «не торопись» - предел выше
  # этот. Слово «подробнее» переключателем намеренно не считается: им
  # ассистент сам заканчивает свои ответы, и каждое уточнение
  # превращалось бы в лекцию.
  detail_words: 300
  # Режим разговора: «давай поговорим», «расскажи сказку», «поболтаем».
  # Тут ассистент перестаёт быть справочником - говорит от себя, сам
  # спрашивает в ответ, в интернет и в записи не лезет. Режим липкий:
  # держится до «хватит», «обычный режим» или «забудь».
  story_words: 3000

data:
  # Папка с моими файлами. Содержимое целиком уходит в системный промпт
  # и перечитывается, если файл изменился.
  dir: "data"
  # false: ассистент сам решает, смотреть ли в записи. Так удобнее -
  # «где лежат болгарки» работает без присказок.
  # true: в записи он смотрит ТОЛЬКО по просьбе - «посмотри в моих
  # записях», «как у меня записано», «по моим заметкам». Остальные
  # вопросы идут в модель и поиск, личных файлов они вообще не видят.
  # Менее удобно, зато заранее понятно, откуда придёт ответ.
  only_on_request: false

logging:
  dir: "logs"
  level: "INFO"
  # Журнал диалогов: по строке JSON на каждый обмен, отдельно от
  # обычного лога. Нужен, чтобы потом разобрать, как ты спрашиваешь, что
  # переспрашиваешь и где поправляешь - и при желании собрать из этого
  # набор для обучения своей модели. Пишется из одного места, поэтому
  # сюда попадает всё: и текстовый режим, и голос, и спутник, и телефон.
  # Файл в .gitignore - это личные разговоры.
  dialogue: true
  dialogue_file: "dialogue.jsonl"

search:
  # Пускать ли ассистента в интернет. Выключи, если хочешь проверить,
  # как он ведёт себя без доступа к сети.
  enabled: true
  # Бэкенд поиска. Сейчас доступен только ddgs - он опрашивает несколько
  # поисковиков сразу, без ключей и аккаунтов. SearXNG на VDS добавим на шаге 3.
  backend: "ddgs"
  # Движок внутри ddgs: auto перебирает доступные и берёт первый удачный.
  # Отдельные движки (duckduckgo, brave, google, yandex) часто отвечают
  # "ничего не найдено" из-за своих лимитов, поэтому auto надёжнее.
  engine: "auto"
  region: "ru-ru"
  max_results: 5
  # Поисковики отвечают через раз: один и тот же запрос то приносит
  # результаты, то падает с «ничего не найдено». Поэтому повторяем,
  # а на последней попытке запрос упрощается (без «какая», «сколько»).
  retries: 3
  # Попытки идут внахлёст, а не одна за другой: если за это время ответа
  # нет, стартует следующая, не отменяя предыдущую. Берём того, кто
  # ответил первым. Замеры: одна попытка занимает от двух до десяти
  # секунд при медиане около пяти, поэтому ждать её до конца дорого.
  # 4 секунды, а не меньше: медиана одной попытки около пяти секунд, и с
  # порогом 2,5 лишняя попытка запускалась почти всегда. Брошенные
  # попытки при этом не отменяются - они продолжают скрести сеть и
  # мешают остальному, вплоть до таймаутов на обращении к модели.
  hedge_after_s: 4.0
  # Общий срок на весь поиск, со всеми попытками. Висящая попытка иначе
  # тянет время на себя: в замерах это двадцать секунд там, где ответа
  # всё равно не было. Лучше честное «не нашла» вовремя. Больше ставить
  # нельзя: модель может сходить в поиск дважды за один вопрос, а весь
  # цикл ограничен agent.total_timeout_s.
  timeout_s: 10
  # Сколько символов страницы отдавать модели. Больше - дороже и медленнее.
  page_chars: 6000
  fetch_timeout_s: 8

agent:
  # Сколько раз модель может сходить в инструменты за один вопрос.
  # Обычного "поиск, потом страница" хватает, запас - на переформулировку.
  max_steps: 4
  # Общий бюджет на весь цикл. Когда он кончается, инструменты отбираются
  # и модель обязана ответить словами: лучше честное "не нашёл", чем тишина.
  total_timeout_s: 35
  # Сколько последних пар вопрос-ответ помнить. Без памяти не работают
  # уточнения: ассистент сам предлагает "рассказать по шагам?", и ответ
  # "да, расскажи" должен попадать в ту же тему, а не в случайный рецепт.
  # Ноль выключает память совсем.
  memory_turns: 3

# Сервер: ПК отвечает на вопросы, пришедшие по домашней сети. Нужен для
# устройства в другой комнате - оно записывает звук и играет ответ, а
# распознавание, модель и синтез остаются здесь, где видеокарта.
# Связь локальная, через роутер: интернет для неё не нужен.
server:
  # 0.0.0.0 - слушать и снаружи этого ПК, иначе телефон не достучится.
  # localhost - только с самого ПК.
  host: "0.0.0.0"
  port: 8765
  # Пока пусто - спросить может любой в домашней сети, в том числе про
  # гараж, рецепты и бюджет. Задай любую строку, и её придётся
  # передавать: ?token=... в адресе или заголовком X-Token.
  token: ""
  # Сколько клиент ждёт ответа. Вопрос с поиском занимает до половины
  # минуты, поэтому с запасом.
  timeout_s: 90
  # Куда стучится спутник (--client). На отдельной железке здесь будет
  # адрес ПК, например http://192.168.1.10:8765
  url: ""

tts:
  enabled: true
  engine: "silero"
  # Модель v5 сама ставит ударения и различает омографы: "замОк" и "зАмок".
  # Ради этого и выбрали Silero вместо Piper - там ударения размечают вручную.
  model: "v5_6_ru"
  # Голоса: aidar, baya, kseniya, xenia, eugene.
  # Послушать все на одной фразе: .\alisa.ps1 --voices
  speaker: "baya"
  sample_rate: 48000
  # Говорить по предложениям, не дожидаясь конца ответа модели. Снимает
  # примерно половину ощущаемой задержки. Выключать только для сравнения.
  stream: true
  # cpu намеренно: распознавание речи на шаге 5 работает через CTranslate2,
  # а не через torch, так что видеопамять торчу не нужна - пусть вся
  # достанется распознаванию. Silero на процессоре успевает с запасом.
  device: "cpu"
  # Куда играть. null - системное устройство по умолчанию.
  # Список устройств с номерами: .\alisa.ps1 --devices
  output_device: null

models:
  # Куда складывать скачанные веса. В .gitignore.
  dir: "models"

stt:
  enabled: true
  engine: "faster-whisper"
  # turbo - это large-v3, ускоренная версия: качество почти то же,
  # а работает в разы быстрее. В 16 ГБ видеопамяти влезает с запасом.
  model: "large-v3-turbo"
  device: "cuda"
  # На Blackwell (RTX 50-й серии) int8 у CTranslate2 раньше падал.
  # Если упадёт - код сам откатится на float16, а потом на процессор,
  # и напишет в лог, что в итоге заработало.
  compute_type: "int8_float16"
  language: "ru"
  # Единица - самый быстрый режим. Больше - чуть точнее и заметно дольше.
  beam_size: 1
  # Отрезает тишину и шум до распознавания: и быстрее, и меньше выдумок.
  vad_filter: true

mic:
  # Откуда писать. null - системный микрофон по умолчанию.
  # Список устройств с номерами: .\alisa.ps1 --devices
  input_device: null
  # Чем определять, что человек договорил:
  #   auto   - silero, если torch есть, иначе по громкости
  #   silero - только silero, падать если torch нет
  #   energy - по громкости, torch не нужен совсем
  # На спутнике ставь energy: silero точнее, но тянет полтора гигабайта
  # torch ради одной маленькой модели.
  vad: "auto"
  # Порог вероятности речи у silero-vad. Ниже - чувствительнее к шуму,
  # выше - может проглотить тихое начало фразы.
  speech_threshold: 0.5
  # Сколько тишины после речи считать концом фразы. Меньше - ассистент
  # перебивает на паузах, больше - дольше ждёшь ответа.
  silence_s: 0.8
  # Короче этого не считаем речью: отсекает кашель и щелчки.
  min_speech_s: 0.3
  # Предел длины фразы.
  max_phrase_s: 15
  # Сколько ждать, пока заговорят, прежде чем бросить запись.
  wait_speech_s: 6

  # Дальше - только для vad: energy (спутник). Порог там плавающий:
  # речью считается то, что громче фона в energy_ratio раз. Жёсткий
  # порог пробовали, и он сломался на живом человеке: голос с пяти
  # метров тише того же голоса в гарнитуру в разы, и ассистент
  # переставал считать речь речью, хотя исправно её записывал.
  #
  # Подобрать помогает .\alisa.ps1 --mic-test: встань туда, где будешь
  # стоять, скажи пару фраз, и он скажет, какое число поставить.
  # Двойка выбрана по замеру на своей же озвучке, приглушённой под
  # расстояние: на «пяти метрах» речью считается 31 процент кадров
  # против 23 при тройке, а в шумной комнате 17 против пяти. Ложных
  # срабатываний на ровном фоне нет ни при той, ни при другой.
  energy_ratio: 2.0
  # Нижняя граница порога: без неё в полной тишине речью становится
  # любой шорох.
  energy_floor: 0.0015
  # Жёсткий порог вместо плавающего, если вдруг понадобится.
  # null - плавающий, так и надо в обычном случае.
  energy_threshold: null

reminders:
  # Пустой URL отключает напоминания. Указать в config.local.yaml на ПК Алисы.
  url: ""
  # Следующие настройки нужны на машине службы python -m assistant.reminders.
  host: "127.0.0.1"
  port: 8766
  database: "state/reminders.sqlite3"
  timezone: "Europe/Moscow"

voice_stop:
  # Спутник слушает отдельное «стоп» во время ответа с WebRTC AEC.
  # При отказе AEC голосовая отмена отключается, Ctrl+C остаётся.
  enabled: true
  min_confidence: 0.9
  # 0 — автоматическая оценка задержки эха; менять после проверки в комнате.
  echo_delay_ms: 0

wake:
  enabled: true
  # Готовые модели openWakeWord англоязычные: hey_jarvis, alexa,
  # hey_mycroft, hey_rhasspy. Своё русское слово - это обучение модели,
  # оно в планах этапа 4.
  model: "hey_jarvis"
  # Порог срабатывания. Ниже - будит чаще, в том числе зря.
  # Подобрать помогает .\alisa.ps1 --wake-test
  #
  # Начинали с 0.5, но живым голосом срабатывало редко. Опущено до 0.3:
  # запас есть, потому что замеры без микрофона дали на тишине, шуме и
  # русской речи не больше 0.001 - то есть до ложных срабатываний
  # остаётся кратный запас. Если всё равно срабатывает редко, смотри
  # цифры в --wake-test и опускай дальше, вплоть до 0.2.
  threshold: 0.3
  # Встроенный в openWakeWord фильтр речи. Отсекает музыку и шум:
  # без него телевизор будит ассистента заметно чаще. Ноль выключает.
  vad_threshold: 0.5
  input_device: null
  # Пауза после ответа, прежде чем снова слушать слово.
  # Движок кодовой фразы:
  #   vosk         — русская фраза, распознавание с ограниченной
  #                  грамматикой. Обучать ничего не надо, фразу меняешь
  #                  строкой ниже. Ест процессора больше.
  #   openwakeword — крошечный классификатор, почти не ест процессор,
  #                  но модели только английские (hey_jarvis и прочие).
  # Вернуться к «эй джарвис» — поставить тут openwakeword, остальное
  # для него ниже сохранено.
  engine: "vosk"
  # Что говорить, чтобы разбудить. Только строчные буквы и пробелы:
  # распознавание возвращает текст именно так.
  phrase: "алиса тян"
  # Другие написания той же фразы. Пусто не просто так: лишние варианты
  # расширяют мишень и добавляют ложных срабатываний. Дописывать сюда
  # стоит только то, что реально видно в --wake-test на твоём голосе.
  variants: []
  # Порог уверенности распознавания по словам фразы. Это главная защита
  # от ложных срабатываний, и она не декоративная: без неё на десяти
  # посторонних фразах было шесть ложных - декодер укладывает в
  # разрешённую фразу вообще всё. С порогом 0.8 стало ноль из десяти,
  # а все пять правильных срабатывают. Ниже 0.5 не опускать.
  min_confidence: 0.8
  # Язык модели vosk. Пусто в model_dir — скачает маленькую модель сама
  # в кэш пользователя, это около сорока пяти мегабайт.
  language: "ru"
  model_dir: ""
  cooldown_s: 1.0
  # Сколько секунд после ответа слушать уточнение без кодовой фразы.
  # Ассистент сам предлагает «рассказать подробнее?», и требовать после
  # этого снова звать его по имени бессмысленно. Ноль - выключить.
  # С наушниками безопасно; с динамиками на этапе 4 проверить, не
  # ловит ли он тут собственный голос.
