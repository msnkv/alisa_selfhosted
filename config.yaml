# Настройки ассистента. Секретов здесь нет - ключи лежат в .env

assistant:
  # Как ассистент называет себя и чьи данные лежат в data/.
  # Поменяй на своё, это просто подставляется в промпт.
  name: "Алиса"
  owner: "Дима"

llm:
  # Актуальное имя быстрой модели DeepSeek (сверено с документацией 22.10.2026).
  model: "deepseek-flash"
  base_url: "https://api.deepseek.com"
  # У DeepSeek размышления включены по умолчанию и добавляют секунды к ответу.
  # Голосовому помощнику они не нужны: вопросы простые, а задержка слышна.
  thinking: false
  # Низкая температура - меньше фантазии в ответах про мои данные.
  temperature: 0.3
  max_tokens: 400
  timeout_s: 30

answer:
  # Ответ произносится вслух, поэтому держим его коротким.
  # Лимита по предложениям не хватает: модель умеет уложить целый рецепт
  # в три предложения по сорок слов каждое. Поэтому ещё и бюджет по словам.
  max_sentences: 3
  max_words: 45

data:
  # Папка с моими файлами. Содержимое целиком уходит в системный промпт
  # и перечитывается, если файл изменился.
  dir: "data"

logging:
  dir: "logs"
  level: "INFO"

search:
  # Пускать ли ассистента в интернет. Выключи, если хочешь проверить,
  # как он ведёт себя без доступа к сети.
  enabled: true
  # Бэкенд поиска. Сейчас доступен только ddgs - он опрашивает несколько
  # поисковиков сразу, без ключей и аккаунтов. SearXNG на VDS добавим на шаге 3.
  backend: "ddgs"
  # Движок внутри ddgs: auto перебирает доступные и берёт первый удачный.
  # Отдельные движки (duckduckgo, brave, google, yandex) часто отвечают
  # "ничего не найдено" из-за своих лимитов, поэтому auto надёжнее.
  engine: "auto"
  region: "ru-ru"
  max_results: 5
  # Поисковики отвечают через раз: один и тот же запрос то приносит
  # результаты, то падает с «ничего не найдено». Поэтому повторяем,
  # а на последней попытке запрос упрощается (без «какая», «сколько»).
  retries: 3
  # Сколько символов страницы отдавать модели. Больше - дороже и медленнее.
  page_chars: 6000
  fetch_timeout_s: 8

agent:
  # Сколько раз модель может сходить в инструменты за один вопрос.
  # Обычного "поиск, потом страница" хватает, запас - на переформулировку.
  max_steps: 4
  # Общий бюджет на весь цикл. Когда он кончается, инструменты отбираются
  # и модель обязана ответить словами: лучше честное "не нашёл", чем тишина.
  total_timeout_s: 35
  # Сколько последних пар вопрос-ответ помнить. Без памяти не работают
  # уточнения: ассистент сам предлагает "рассказать по шагам?", и ответ
  # "да, расскажи" должен попадать в ту же тему, а не в случайный рецепт.
  # Ноль выключает память совсем.
  memory_turns: 3

tts:
  enabled: true
  engine: "silero"
  # Модель v5 сама ставит ударения и различает омографы: "замОк" и "зАмок".
  # Ради этого и выбрали Silero вместо Piper - там ударения размечают вручную.
  model: "v5_6_ru"
  # Голоса: aidar, baya, kseniya, xenia, eugene.
  # Послушать все на одной фразе: .\alisa.ps1 --voices
  speaker: "xenia"
  sample_rate: 48000
  # Говорить по предложениям, не дожидаясь конца ответа модели. Снимает
  # примерно половину ощущаемой задержки. Выключать только для сравнения.
  stream: true
  # cpu намеренно: распознавание речи на шаге 5 работает через CTranslate2,
  # а не через torch, так что видеопамять торчу не нужна - пусть вся
  # достанется распознаванию. Silero на процессоре успевает с запасом.
  device: "cpu"
  # Куда играть. null - системное устройство по умолчанию.
  # Список устройств с номерами: .\alisa.ps1 --devices
  output_device: null

models:
  # Куда складывать скачанные веса. В .gitignore.
  dir: "models"

stt:
  enabled: true
  engine: "faster-whisper"
  # turbo - это large-v3, ускоренная версия: качество почти то же,
  # а работает в разы быстрее. В 16 ГБ видеопамяти влезает с запасом.
  model: "large-v3-turbo"
  device: "cuda"
  # На Blackwell (RTX 50-й серии) int8 у CTranslate2 раньше падал.
  # Если упадёт - код сам откатится на float16, а потом на процессор,
  # и напишет в лог, что в итоге заработало.
  compute_type: "int8_float16"
  language: "ru"
  # Единица - самый быстрый режим. Больше - чуть точнее и заметно дольше.
  beam_size: 1
  # Отрезает тишину и шум до распознавания: и быстрее, и меньше выдумок.
  vad_filter: true

mic:
  # Откуда писать. null - системный микрофон по умолчанию.
  # Список устройств с номерами: .\alisa.ps1 --devices
  input_device: null
  # Порог вероятности речи у silero-vad. Ниже - чувствительнее к шуму,
  # выше - может проглотить тихое начало фразы.
  speech_threshold: 0.5
  # Сколько тишины после речи считать концом фразы. Меньше - ассистент
  # перебивает на паузах, больше - дольше ждёшь ответа.
  silence_s: 0.8
  # Короче этого не считаем речью: отсекает кашель и щелчки.
  min_speech_s: 0.3
  # Предел длины фразы.
  max_phrase_s: 15
  # Сколько ждать, пока заговорят, прежде чем бросить запись.
  wait_speech_s: 6

wake:
  enabled: true
  # Готовые модели openWakeWord англоязычные: hey_jarvis, alexa,
  # hey_mycroft, hey_rhasspy. Своё русское слово - это обучение модели,
  # оно в планах этапа 4.
  model: "hey_jarvis"
  # Порог срабатывания. Ниже - будит чаще, в том числе зря.
  # Подобрать помогает .\alisa.ps1 --wake-test
  #
  # Начинали с 0.5, но живым голосом срабатывало редко. Опущено до 0.3:
  # запас есть, потому что замеры без микрофона дали на тишине, шуме и
  # русской речи не больше 0.001 - то есть до ложных срабатываний
  # остаётся кратный запас. Если всё равно срабатывает редко, смотри
  # цифры в --wake-test и опускай дальше, вплоть до 0.2.
  threshold: 0.3
  # Встроенный в openWakeWord фильтр речи. Отсекает музыку и шум:
  # без него телевизор будит ассистента заметно чаще. Ноль выключает.
  vad_threshold: 0.5
  input_device: null
  # Пауза после ответа, прежде чем снова слушать слово.
  cooldown_s: 1.0
